name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb zip
      - run: npm ci
      - run: npm run fixtures
      - run: npm run fixtures:long
      - run: npm run build
      - run: npm test
      - run: npm run lint:firefox
      - name: Fetch a Chromium that still supports --load-extension
        run: |
          mkdir -p /tmp/chr && cd /tmp/chr
          TAG=$(curl -sI https://github.com/ungoogled-software/ungoogled-chromium-portablelinux/releases/latest | grep -i ^location | sed 's#.*/tag/##' | tr -d '\r')
          curl -sL -o c.tar.xz "https://github.com/ungoogled-software/ungoogled-chromium-portablelinux/releases/download/$TAG/ungoogled-chromium-$TAG-x86_64_linux.tar.xz"
          tar xf c.tar.xz
      - run: npm run test:e2e
      - run: npm run pack
      - uses: actions/upload-artifact@v4
        with: { name: extension-zips, path: dist/*.zip }
