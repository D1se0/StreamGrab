name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb zip
      - run: npm ci
      - run: npm run fixtures
      - run: npm run fixtures:long
      - run: npm run build
      - run: npm test
      - run: npm run lint:firefox
      - name: Fetch a Chromium that still supports --load-extension (pinned; later builds drop the flag)
        run: |
          mkdir -p /tmp/chr && cd /tmp/chr
          TAG=156.0.8078.79-1
          curl -sL -o c.tar.xz "https://github.com/ungoogled-software/ungoogled-chromium-portablelinux/releases/download/$TAG/ungoogled-chromium-$TAG-x86_64_linux.tar.xz"
          tar xf c.tar.xz
          ./ungoogled-chromium-$TAG-x86_64_linux/chrome --version
      - id: e2e
        continue-on-error: true
        run: set -o pipefail; npm run test:e2e 2>&1 | tee e2e.log
      - if: steps.e2e.outcome == 'failure'
        name: publish e2e failures as annotations
        run: |
          { grep -E '^(FAIL|DIAG|\[e2e\])' e2e.log || true; echo '---- tail ----'; tail -18 e2e.log; } | head -46 | sed 's/^/::error::/'
          exit 1
      - uses: actions/upload-artifact@v4
        if: steps.e2e.outcome == 'success'
        with: { name: extension-zips, path: dist/*.zip }
      - run: npm run pack
      - uses: actions/upload-artifact@v4
        with: { name: extension-zips, path: dist/*.zip }
