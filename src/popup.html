<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link rel="stylesheet" href="popup.css"><title>StreamGrab</title></head>
<body>
<header>
  <div class="logo"><img id="logoImg" src="icons/icon48.png" alt=""><b>StreamGrab</b></div>
  <div class="hright"><div class="active" id="active" hidden></div><div class="site" id="site"></div></div>
</header>
<nav class="tabs" id="tabs" role="tablist"></nav>
<main>
  <section id="tab-detected" role="tabpanel"><div class="toolbar" id="dToolbar"></div><div id="list" class="stack"></div><div id="empty" class="empty" hidden></div></section>
  <section id="tab-history" role="tabpanel" hidden><div class="search" id="searchBox"></div><div class="summary" id="hSummary"></div><div id="hlist" class="stack"></div><div id="hEmpty" class="empty" hidden></div><div class="toolbar end" id="hFooter"></div></section>
  <section id="tab-settings" role="tabpanel" hidden></section>
</main>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script src="popup.js"></script></body></html>
